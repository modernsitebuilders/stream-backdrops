name: Sync analytics sheet to Neon

# PRIMARY Sheets→Neon mirror (runs 4x/day, every 6 hours).
#
# The per-event live dual-write (lib/neonEvents.mjs) is now DISABLED by default
# (gated behind NEON_LIVE_WRITE, off) because writing to Neon on every tracked event
# kept the serverless compute awake continuously and never let it auto-suspend. So
# this scheduled `npm run data:sync` is now the main way Neon stays current, not just
# a backstop. Running every 6 hours matches the Google Sheet's own 6-hour Redis flush
# cadence — the Sheet can't be fresher than that anyway — so batching here loses no
# data the live writes would have captured, while letting Neon scale to zero between runs.
# Each run:
#   - pulls all new Analytics/Email/Review rows from the Sheet into Neon
#   - refreshes the low-volume tables (licensing_inquiries has no live-write endpoint)
# The sync is idempotent (ON CONFLICT (row_hash) DO NOTHING), so re-runs only add
# genuinely new rows — safe and cheap. (Flip NEON_LIVE_WRITE=1 in Vercel to also
# restore live per-event writes on top of this.)
#
# After the sync it also runs `npm run flag:bots`, the authoritative session-level
# behavioral-bot classifier (scripts/data-platform/flag-bots.mjs). The tracking
# endpoints only set a header-level is_bot PRE-tag at ingest; the single-event-
# session fingerprint that actually identifies the crawler is an aggregate signal,
# so it has to be applied by this daily pass. It's monotonic (false→true only) and
# idempotent, so re-running it daily just flags any newly-arrived bot rows.
#
# NOT a Vercel cron (Hobby plan caps those) — GitHub Actions, same as submit-indexnow.

on:
  schedule:
    - cron: '17 */6 * * *'   # every 6h (4x/day) at :17 past 00/06/12/18 UTC. Matches the Sheet's 6h Redis flush; :17 avoids the top-of-hour stampede.
  workflow_dispatch: {}     # manual "Run workflow" for an on-demand reconcile

concurrency:
  group: sync-neon
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync sheet tabs into Neon
        run: npm run data:sync
        env:
          # npm run data:sync uses --env-file-if-exists=.env.local, which is absent
          # in CI, so it reads these from the process env (GitHub repo secrets).
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SERVICE_EMAIL: ${{ secrets.GOOGLE_SERVICE_EMAIL }}
          GOOGLE_PRIVATE_KEY: ${{ secrets.GOOGLE_PRIVATE_KEY }}

      - name: Flag behavioral-bot rows (is_bot)
        # Runs after the sync so any rows the reconcile just added get classified in
        # the same pass. Only needs Neon — it reads/writes analytics_events in place.
        run: npm run flag:bots
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
